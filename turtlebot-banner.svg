<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#232a33" stroke-width="1"/>
    </pattern>
    <radialGradient id="beam" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(880 125) scale(170)">
      <stop offset="0" stop-color="#3ddc84" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3ddc84" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="map"><rect x="640" y="24" width="540" height="192" rx="10"/></clipPath>
    <style>
      .name { font: 700 46px "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #f5f7fa; letter-spacing: -0.5px; }
      .role { font: 400 19px "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #a9b4c2; }
      .tag { font: 500 14px Menlo, Consolas, monospace; fill: #3ddc84; }
      .path { stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
      .sweep { transform-origin: 880px 125px; animation: spin 3s linear infinite; }
      .goal { transform-origin: 1100px 130px; animation: pulse 2s ease-in-out infinite; }
      @keyframes flow { to { stroke-dashoffset: -12; } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: 1; transform: scale(1.25); } }
      @media (prefers-reduced-motion: reduce) { .path, .sweep, .goal { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="240" rx="14" fill="#14181d"/>

  <!-- identity -->
  <text x="64" y="104" class="name">Kazi Ayman Rahman</text>
  <text x="66" y="140" class="role">Mechatronics Engineering (Hons), University of Sydney</text>
  <text x="66" y="166" class="role">Robotics and Intelligent Systems</text>
  <text x="66" y="200" class="tag">$ ros2 launch turtlebot navigation</text>

  <!-- occupancy map -->
  <g clip-path="url(#map)">
    <rect x="640" y="24" width="540" height="192" fill="#181d23"/>
    <rect x="640" y="24" width="540" height="192" fill="url(#grid)"/>
    <g class="sweep">
      <path d="M880 125 L1050 125 A170 170 0 0 0 1010.2 15.7 Z" fill="url(#beam)"/>
    </g>
    <g fill="none" stroke="#ff5a5a" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="0 7">
      <path d="M660 40H900V70H990V40H1160V200H1010V165H960V200H660Z"/>
      <circle cx="780" cy="120" r="14"/>
    </g>
    <path d="M880 125 C 930 125, 940 110, 975 110 S 1060 140, 1100 130" fill="none" stroke="#3ddc84" stroke-width="2.5" class="path"/>
    <circle cx="1100" cy="130" r="7" fill="none" stroke="#3ddc84" stroke-width="2" class="goal"/>
    <circle cx="1100" cy="130" r="2.5" fill="#3ddc84"/>
  </g>
  <rect x="640" y="24" width="540" height="192" rx="10" fill="none" stroke="#2a323c"/>

  <!-- TurtleBot, top view -->
  <g transform="translate(880 125)">
    <rect x="-9" y="-25" width="18" height="7" rx="2" fill="#0b0e11"/>
    <rect x="-9" y="18" width="18" height="7" rx="2" fill="#0b0e11"/>
    <circle r="20" fill="#2d3540" stroke="#56606d" stroke-width="2"/>
    <circle r="9" fill="#11151a" stroke="#3ddc84" stroke-width="1.5"/>
    <circle r="2.5" fill="#3ddc84"/>
    <path d="M14 0 L24 0" stroke="#f5f7fa" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M21 -4 L26 0 L21 4" fill="none" stroke="#f5f7fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
