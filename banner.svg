<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <style>
      .name { font: 700 52px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff; }
      .sub  { font: 400 22px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #cbd5e1; }
      .orbit { fill: none; stroke: #38BDF8; stroke-opacity: 0.25; stroke-width: 2; }
      .dot { fill: #38BDF8; animation: pulse 2.5s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    </style>
  </defs>
  <rect width="1200" height="220" rx="16" fill="url(#bg)"/>
  <circle class="orbit" cx="1080" cy="110" r="70"/>
  <circle class="orbit" cx="1080" cy="110" r="45"/>
  <circle cx="1080" cy="110" r="18" fill="#c2410c"/>
  <circle class="dot" cx="1150" cy="110" r="6"/>
  <circle class="orbit" cx="120" cy="110" r="55"/>
  <circle class="dot" cx="65" cy="110" r="5" style="animation-delay: 1s"/>
  <text x="600" y="105" text-anchor="middle" class="name">Kazi Ayman Rahman</text>
  <rect x="450" y="122" width="300" height="4" rx="2" fill="url(#accent)"/>
  <text x="600" y="162" text-anchor="middle" class="sub">Mechatronics Engineering (Hons) | Robotics and Intelligent Systems</text>
</svg>
